image:
  tag: "3.15.0"

config:
  existingSecret: quay-config

migration:
  enabled: true
  targetRevision: head
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  annotations:
    example.com/migration-purpose: schema-upgrade
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 750m
      memory: 1Gi
