image:
  tag: "3.15.0"

imagePullSecrets:
  - name: "123"

config:
  existingSecret: quay-config

serviceAccount:
  annotations:
    example.com/workload-identity: quay
  imagePullSecrets:
    - name: "true"

app:
  enabled: true
  replicaCount: 2
  podAnnotations:
    secret.reloader.stakater.com/reload: quay-config
  podLabels:
    example.com/workload: app
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  tolerations:
    - key: dedicated
      operator: Equal
      value: app
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: app
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

workers:
  enabled: true
  podAnnotations:
    secret.reloader.stakater.com/reload: quay-config
  podLabels:
    example.com/workload: workers
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  tolerations:
    - key: dedicated
      operator: Equal
      value: workers
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: bkg-workers
