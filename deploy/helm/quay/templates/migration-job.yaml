{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migration" (include "quay.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "quay.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  {{- with .Values.migration.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "quay.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ default (include "quay.fullname" .) .Values.serviceAccount.name }}
      volumes:
        - name: configvolume
          secret:
            secretName: {{ .Values.config.existingSecret }}
      nodeSelector:
        {{- toYaml .Values.migration.nodeSelector | nindent 8 }}
      containers:
        - name: quay-migration
          image: {{ include "quay.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /quay-registry/quay-entrypoint.sh
            - migrate
            - {{ .Values.migration.targetRevision | quote }}
          volumeMounts:
            - name: configvolume
              mountPath: /conf/stack
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          env:
            - name: QE_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: QE_K8S_CONFIG_SECRET
              value: {{ .Values.config.existingSecret | quote }}
            - name: DEBUGLOG
              value: {{ .Values.migration.environment.DEBUGLOG | quote }}
{{- end }}
