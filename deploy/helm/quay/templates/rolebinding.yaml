{{- if or .Values.app.enabled .Values.workers.enabled .Values.migration.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quay.fullname" . }}
  labels:
    {{- include "quay.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quay.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ default (include "quay.fullname" .) .Values.serviceAccount.name }}
{{- end }}
